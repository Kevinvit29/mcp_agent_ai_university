name: Release Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend release gates
        env:
          APP_ENV: development
          APP_SECRET_KEY: ci-development-secret-at-least-32-characters-long
          MCP_INTERNAL_KEY: ci-mcp-development-key-at-least-32-characters
          ADMIN_PASSWORD: ci-only-admin-password
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build
